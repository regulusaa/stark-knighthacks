<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stark · HUD Lab</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../styles/hud.css">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #050208; }
    #hud { position: fixed; inset: 0; pointer-events: none; transition: opacity 200ms ease; }
    @media (prefers-reduced-motion: reduce) { #hud { transition: none; } }
  </style>
</head>
<body>
  <div id="hud"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module">
    import { mountHud } from '../hud.js';
    import { EVENTS, ROLES } from '/contract/contract.js';
    const query = new URLSearchParams(location.search);
    const root = document.getElementById('hud');
    const read = async name => {
      const response = await fetch(`/contract/fixtures/${name}.json`);
      if (!response.ok) throw new Error(`Fixture unavailable: ${name}`);
      return response.json();
    };
    const [fixture, focused] = await Promise.all([read('display-state'), read('focus-state')]);
    // A default preview registers a fixture display so its QR links to a real room.
    // ?room=CODE can use an existing room without taking over its display.
    let socket;
    let room = query.get('room');
    if (!room) {
      socket = window.io({ reconnection: false });
      room = await new Promise(resolve => {
        const timeout = setTimeout(() => resolve(null), 5000);
        socket.on('connect', () => socket.emit(EVENTS.REGISTER, { role: ROLES.DISPLAY }, ack => { clearTimeout(timeout); resolve(ack?.ok ? ack.room : null); }));
        socket.on('connect_error', () => { clearTimeout(timeout); resolve(null); });
      });
    }
    const idle = { ...fixture, room, focus: null, driver: null, controllerCount: 0 };
    const states = [
      { name: 'idle', state: idle },
      { name: 'focused', state: { ...fixture, room, focus: focused } },
      { name: 'stability', state: { ...fixture, room, mode: 'stability', focus: null } },
    ];
    const listeners = { state: new Set(), focus: new Set() };
    let current = idle;
    let visible = true;
    const api = {
      onState(cb) { listeners.state.add(cb); cb(current); return () => listeners.state.delete(cb); },
      onFocus(cb) { listeners.focus.add(cb); cb(current.focus); return () => listeners.focus.delete(cb); },
      getRoom() { return room; },
      setVisible(value) { visible = Boolean(value); root.style.opacity = visible ? '1' : '0'; root.setAttribute('aria-hidden', String(!visible)); },
    };
    const mounted = mountHud(root, api);
    function show(name) {
      const entry = states.find(item => item.name === name) || states[0];
      current = entry.state;
      document.body.dataset.scene = entry.name;
      for (const cb of listeners.state) cb(current);
      for (const cb of listeners.focus) cb(current.focus);
      if (socket?.connected && room) socket.emit(EVENTS.DISPLAY_STATE, current);
    }
    let index = 0;
    show(query.get('scene') || 'idle');
    // ?scene=idle|focused|stability freezes one fixture for repeatable screenshots.
    const timer = query.has('scene') ? null : setInterval(() => { index = (index + 1) % states.length; show(states[index].name); }, 3000);
    window.addEventListener('keydown', event => { if (event.key.toLowerCase() === 'h') api.setVisible(!visible); });
    window.addEventListener('pagehide', () => { clearInterval(timer); mounted.destroy(); socket?.close(); }, { once: true });
    window.__hudLab = { api, show, mounted };
    await new Promise(resolve => setTimeout(resolve, 250));
    window.__starkReady = true;
  </script>
</body>
</html>
