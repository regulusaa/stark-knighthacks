<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Stark · CX-9 preview</title><link rel="icon" href="data:,"><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#050208;overflow:hidden}iframe{display:block}</style></head><body><iframe title="Controller preview" id="preview"></iframe><script type="module">
const query=new URLSearchParams(location.search);
const scene=query.get('scene')||'first';
const frame=document.getElementById('preview');
frame.src=`/controller?room=7KQ2M&mock=1&v3=1&scene=idle${scene==='first'?'':'&role=host&key=test'}`;
await new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
const win=frame.contentWindow;const doc=frame.contentDocument;
while(!win.__starkReady)await new Promise(r=>setTimeout(r,20));
while(!['host','guest-viewing'].includes(doc.getElementById('app').dataset.state))await new Promise(r=>setTimeout(r,20));
if(scene!=='first'&&scene!=='reset-hold'){
  doc.querySelector(`[data-demo-beat="${scene}"]`).click();
  while(doc.querySelector(`[data-demo-beat="${scene}"]`).getAttribute('aria-pressed')!=='true'||doc.querySelector('[data-demo-beat][aria-busy="true"]'))await new Promise(r=>setTimeout(r,20));
}
if(scene==='reset-hold'){
  const button=doc.querySelector('.demo-reset');
  button.dispatchEvent(new win.KeyboardEvent('keydown',{key:' ',bubbles:true,cancelable:true}));
  await new Promise(r=>setTimeout(r,480));
}else await new Promise(r=>setTimeout(r,150));
window.__starkReady=true;
</script></body></html>
