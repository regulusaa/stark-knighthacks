<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Immersion · local interaction lab</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/ui/styles/tokens.css"><link rel="stylesheet" href="/ui/controller.css"><link rel="stylesheet" href="/ui/styles/inspection-workspace.css"><link rel="stylesheet" href="/ui/immersion/immersion.css"><style>body{height:100dvh;margin:0;color:#f3eef7;background:#050208}.workbench{height:calc(100dvh - 56px)!important}.dev-status{height:56px;padding:8px 16px;box-sizing:border-box;display:flex;align-items:center;gap:16px;font-size:14px}.dev-status select{font:inherit;min-height:40px;background:#111;color:white}#notice{position:fixed;left:16px;bottom:16px;background:#111;padding:12px;z-index:9;pointer-events:none}</style></head><body class="inspection-controller"><header class="dev-status">Private Immersion lab <select aria-label="Lab image"></select></header><main class="workbench" data-active-workspace="immersion"><aside class="side-panel"></aside></main><div id="notice" hidden></div><script type="module">
import {mountWorkspaceTabs} from '/ui/workspace-tabs.js';import {createImmersion} from '/ui/immersion/workspace.js';
const workbench=document.querySelector('.workbench'),side=document.querySelector('.side-panel');let immersion;
const tabs=mountWorkspaceTabs(side,{onSelect:name=>immersion?.selectTab(name)});
immersion=createImmersion({workbench,panel:tabs.panels.immersion,notify:text=>{const e=document.querySelector('#notice');e.hidden=false;e.textContent=text;setTimeout(()=>e.hidden=true,5000)}});tabs.select('immersion');
const manifest=await fetch('/assets/manifest.json').then(r=>r.json()),select=document.querySelector('select');
for(const image of manifest.images){const o=document.createElement('option');o.value=image.id;o.textContent=image.name;select.append(o)}
async function load(id){const image=manifest.images.find(e=>e.id===id);select.value=id;const tree=await fetch('/'+image.folder+'tree.json').then(r=>r.json());immersion.setContext({display:{image:{id,name:image.name,category:image.category},scoreKind:tree.scoreKind??'softmax',top1:tree.top1,trueClass:tree.trueClass,answers:tree.topK.slice(0,10)}})}
select.onchange=()=>load(select.value);await load(new URLSearchParams(location.search).get('image')??'ambig_cat');
const params=new URLSearchParams(location.search);if(params.get('extract')==='1'){
 const timer=setInterval(()=>{const frame=document.querySelector('iframe'),engine=frame?.contentWindow?.__immersion;if(engine?.records.size){const key='class:620';engine.command({action:'select',key});engine.command({action:'extract',key});engine.command({action:'annotate',key,name:'Laptop · investigate',notes:'Compare its strongest region with the cat’s eyes.'});clearInterval(timer)}},100);
}
</script></body></html>
